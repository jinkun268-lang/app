include = '/var/lib/postgresql/citrus14/postgresql.conf'
data_directory = '/var/lib/postgresql/citrus14'
hba_file = '/var/lib/postgresql/citrus14/pg_hba.conf'
ident_file = '/var/lib/postgresql/citrus14/pg_ident.conf'
external_pid_file = '/run/postgresql/14-main.pid'
cluster_name = '14/main'
port = 5432
listen_addresses = 'localhost'
unix_socket_directories = '/var/lib/postgresql/citrus-socket,/var/run/postgresql'
ssl = on
ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
