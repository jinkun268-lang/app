name: android

# 手动触发或打 tag 时构建 APK，并发布到服务器下载页与 GitHub Release。
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名（留空则用 0.1.<MMDD>）'
        required: false
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: android-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 SDK 组件
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then echo "找不到 sdkmanager"; exit 1; fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备签名证书
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/citrus.keystore"
            echo "CITRUS_KEYSTORE_FILE=$RUNNER_TEMP/citrus.keystore" >> "$GITHUB_ENV"
            echo "已使用配置的签名证书"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次将使用 debug 签名"
          fi

      - name: 计算版本号
        run: |
          CODE="$(git rev-list --count HEAD)"
          NAME="${{ inputs.version_name }}"
          if [ -z "$NAME" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$NAME" ]; then NAME="0.1.$(date +%m%d)"; fi
          { echo "APP_CODE=$CODE"; echo "APP_NAME=$NAME"; } >> "$GITHUB_ENV"
          echo "versionCode=$CODE  versionName=$NAME"

      - name: 单元测试（结果单独可见，不阻断出包）
        continue-on-error: true
        run: |
          cd android
          ./gradlew --no-daemon :app:testDebugUnitTest \
            -PappVersionCode="$APP_CODE" -PappVersionName="$APP_NAME"

      - name: 打包 release APK
        env:
          CITRUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CITRUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CITRUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionCode="$APP_CODE" -PappVersionName="$APP_NAME"

      - name: 整理产物
        run: |
          mkdir -p dist
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          cp "$APK" "dist/citrus-collect-v$APP_NAME.apk"
          cp "$APK" "dist/citrus-collect-latest.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.APP_NAME }}
          path: dist/*.apk
          retention-days: 30

      - name: 上传到服务器下载页
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -P "$SSH_PORT" -i ~/.ssh/id_ed25519 dist/*.apk "$SSH_USER@$SSH_HOST:/opt/citrus-app/downloads/"
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "ls -lh /opt/citrus-app/downloads/ | tail -3"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'android-latest' }}
          name: 柑橘采集 ${{ env.APP_NAME }}
          body: |
            - versionName：${{ env.APP_NAME }}
            - versionCode：${{ env.APP_CODE }}
            - 直接下载：https://api.homemanager.com.cn/downloads/citrus-collect-latest.apk
          files: dist/*.apk
          prerelease: true
