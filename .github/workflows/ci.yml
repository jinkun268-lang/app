name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 后端与契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      # 短信登录用例依赖阿里云 SDK；缺少时该用例会 ModuleNotFoundError。
      - run: pip install -r server/requirements-sms.txt
      - name: pytest（内存库，跳过 MySQL 用例）
        run: APP_DATABASE_URL=memory python -m pytest server/tests -q -k 'not mysql'
      - name: 契约检查
        run: python tools/lint_contract.py

  admin:
    name: 管理端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vitest 5 的 threads worker 在 Node 20 上启动失败，需 22+。
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm --prefix admin ci
      - run: npm --prefix admin run typecheck
      - run: npm --prefix admin test
      - run: npm --prefix admin run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          retention-days: 7
