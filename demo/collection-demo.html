;color:#eff5e8;font-size:11px;background:#213b2ca6;border-radius:20px;padding:6px 12px}.camera-controls{background:#183323;color:#fff;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.shutter{height:63px;width:63px;flex-shrink:0;border-radius:50%;background:#fff;border:5px solid #a4b2a1;box-shadow:inset 0 0 0 4px #183323}.camera-controls .camera-finish{border:1px solid #ffffff55;border-radius:8px;color:white;padding:9px 12px;font-size:11px}.film{display:flex;gap:6px;padding:10px;background:#1e3829;min-height:61px;overflow:auto}.film img{height:42px;width:42px;object-fit:cover;border:1px solid #c7d7c2;border-radius:5px}.film p{color:#a7bba0;font-size:11px;padding:9px 6px}.empty{padding:65px 25px;text-align:center;color:#8f9c83}.empty strong{display:block;font-weight:500;color:#586e4b;margin:12px 0 5px}.empty p{font-size:11px}.uploading-mask{position:absolute;inset:0;background:#1833238c;z-index:40;display:grid;place-items:center}.uploading-box{background:white;border-radius:15px;width:260px;padding:25px}.uploading-box h3{font-size:15px}.uploading-box p{font-size:11px;color:#85937a;margin:8px 0 14px}.progress{height:5px;background:#edf1e6;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);animation:progress 1s ease-out forwards}.history-line{display:flex;gap:10px;align-items:center;padding:11px 17px;border-bottom:1px solid var(--line)}.history-line img{width:50px;height:50px;border-radius:8px;object-fit:cover}.history-line div{flex:1}.history-line strong{font-size:12px;display:block}.history-line small{font-size:10px;color:var(--muted)}.history-line span{font-size:10px;color:var(--green)}.file-input{display:none}@keyframes slide{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes progress{from{width:0}to{width:100%}}@media(max-width:1060px){.desk{grid-template-columns:235px 420px;justify-content:center <body>
<div class="desk">
 <aside class="intro">
  <div class="brand"><span id="brand-icon"></span><b>橘野 · 采集手记</b></div>
  <div class="eyebrow">CITRUS FIELD NOTES / 02</div>
  <h1>连续拍摄。<br>每张图，<br><em>独立成条。</em></h1>
  <p>把一次采集放进同一个批次，<br>把判断和处理留给每张图片。</p>
  <div class="model">
   <div class="model-item"><b>01</b><div><strong>批次负责共同信息</strong><small>地点、日期、采集人、默认品种</small></div></div>
   <div class="model-item"><b>02</b><div><strong>图片负责自己的内容</strong><small>部位、类别、症状、上传与核验状态</small></div></div>
   <div class="model-item"><b>03</b><div><strong>同一对象，按需关联</strong><small>同一片叶子的不同视角仍可关联</small></div></div>
  </div>
  <div class="footnote">交互原型 · 不连接真实后台<br>示意图片不代表病虫害诊断或研究数据</div>
 </aside>
 <main class="phone" aria-label="柑橘采集手机交互演示">
  <div class="statusbar"><span>09:41</span><span>5G ▮▮▮ ▰</span></div><div class="notch"></div>
  <header class="app-head"><div><div class="app-title" id="page-title"></div><div class="sub" id="page-sub"></div></div><span class="demo-tag">交互演示</span></header>
  <section class="scroller" id="content"></section>
  <nav class="bottom-nav" id="nav" aria-label="底部导航"></nav>
  <div id="selection"></div><div id="overlay"></div><div id="modal"></div><div id="feedback" role="status" aria-live="polite"></div>
  <input class="file-input" type="file" id="import-input" accept="image/*" multiple>
  <input class="file-input" type="file" id="retake-input" accept="image/*">
 </main>
 <aside class="aside">
  <div class="eyebrow">TRY THE FLOW</div>
  <button class="try-item" data-action="go-capture"><strong><span>01</span>连续拍三张</strong><p>每按一次快门，保存一条图片记录。</p></button>
  <button class="try-item" data-action="try-select"><strong><span>02</span>批量填写共同信息</strong><p>选中几张图统一填写，单图还能继续修改。</p></button>
  <button class="try-item" data-action="show-uploaded"><strong><span>03</span>查看已上传图片</strong><p>每张图单独核验、单独撤回，互不影响。</p></button>
  <div class="aside-note"><b>这不是一条记录里的图片附件</b>每张图拥有自己的编号、信息与状态。批量操作只为省步骤，不把它们绑在一起。</div>
  <button class="text-btn" data-action="reset" style="margin-top:20px;color:#929b86">重置演示数据 ↺</button>
 </aside>
</div>
<script>
const icons={leaf:'<path d="M20 4C10 2 3 7 5 15c2 7 13 6 15-11Z"/><path d="m4 21 12-12M8 16l-1-6m5 2 6 1"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',camera:'<path d="M8 6l2-3h4l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="4"/>',folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l3 4h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>',check:'<path d="m5 12 4 4L19 6"/>',back:'<path d="m15 5-7 7 7 7"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/>',plus:'<path d="M12 5v14M5 12h14"/>',photo:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="2"/><path d="m3 17 6-6 4 4 3-3 5 5"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/>'};
const ico=(name,size=21)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.leaf}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function art(kind=0){

  return `<section class="recognition-panel" aria-label="单张识别">${heading}<p>${r.status==='applied'?'已采用识别建议，仍可在下方人工修正。':'示例候选已生成，请选择后确认采用；不会自动覆盖采集信息。'}</p><div class="recognition-summary">示例部位：${esc(r.part)}</div><div class="recognition-candidates">${r.candidates.map((label,index)=>`<button type="button" class="${index===r.selected?'chosen':''}" data-action="recognition-candidate" data-id="${p.id}" data-index="${index}" aria-pressed="${index===r.selected}" ${read?'disabled':''}>${esc(label)}</button>`).join('')}</div><p>以上是交互示例，不是真实识别结论。${p.src?'导入图片的内容未被分析。':''}</p>${read?'':`<button type="button" class="primary" data-action="apply-recognition" data-id="${p.id}">采用“${esc(picked)}”并填写部位</button><button type="button" class="text-btn" data-action="recognize" data-id="${p.id}">重新识别</button>`}</section>`;
 }
 return `<section class="recognition-panel" aria-label="单张识别">${heading}<p>对当前图片生成候选结果，由你确认或修正。也可以直接手动填写。</p><button type="button" class="primary" data-action="recognize" data-id="${p.id}">开始识别此图片</button></section>`;
}

 const p=photos.find(p=>p.id===id);if(!p||p.status==='uploaded')return;
 const fields=Object.fromEntries(new FormData(form));
 for(const key of ['variety','part','label','symptoms','object','note'])p[key]=fields[key]||'';
 p.status=isComplete(p)?'pending':'draft';
}
function refreshRecognitionPanel(id){
 const form=document.querySelector('#detail-form');
 if(form&&Number(form.elements.id.value)===id){
  const current=document.querySelector('.recognition-panel');
  const p=photos.find(p=>p.id===id);
  if(current&&p)current.outerHTML=recognitionHTML(p);
 }
}
function recognizeOne(id){
 const p=photos.find(p=>p.id===id);if(!p||p.status==='uploaded')return;
 if(p.recognition?.status==='running'){toast('这张图片正在识别中');return;}
 rememberDetailForm(id);
 const run={status:'running'};p.recognition=run;
 const form=document.querySelector('#detail-form');
 if(form&&Number(form.elements.id.value)===id)refreshRecognitionPanel(id);else detail(id);
 render();
 setTimeout(()=>{
  if(!photos.includes(p)||p.recognition!==run||p.status==='uploaded')return;
  run.status='ready';run.part=p.src?'其他':p.art===2?'果':'叶';
  run.candidates=p.src?['不确定','疑似溃疡病','疑似虫害']:p.art===3?['健康对照','不确定','疑似虫害']:['疑似溃疡病','疑似炭疽病','不确定'];
  run.selected=0;refreshRecognitionPanel(id);render();toast('示例识别完成，请人工确认后采用');
 },900);
}
function chooseRecognitionCandidate(id,index){
 const p=photos.find(p=>p.id===id),r=p?.recognition;
 if(!p||p.status==='uploaded'||!r||!r.candidates?.[index])return;
 r.selected=index;r.status='ready';refreshRecognitionPanel(id);
}
function applyRecognition(id){
 const p=photos.find(p=>p.id===id),r=p?.recognition;
 if(!p||p.status==='uploaded'||!r||!['ready','applied'].includes(r.status))return;
 rememberDetailForm(id);p.part=r.part;p.label=r.candidates[r.selected];r.status='applied';
 p.status=isComplete(p)?'pending':'draft';detail(id);render();toast('已填入部位和初步类别，可继续修正后保存');
}

document.addEventListener('click',event=>{
 const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,id=Number(el.dataset.id);
 switch(action){
  case 'nav':page=el.dataset.page;selected.clear();selecting=false;render();break;
  case 'tab':tab=el.dataset.tab;selected.clear();selecting=false;render();break;
  case 'detail':detail(id);break;
  case 'close-overlay':closeOverlay();break;
  case 'close-modal':closeModal();break;
  case 'save-detail':saveDetail(el.dataset.upload==='yes');break;
  case 'recognize':recognizeOne(id);break;
  case 'recognition-candidate':chooseRecognitionCandidate(id,Number(el.dataset.index));break;
  case 'apply-recognition':applyRecognition(id);break;
  case 'toggle-select':selecting=!selecting;selected.clear();render();break;
  case 'select':selected.has(id)?selected.delete(id):selected.add(id);render();break;
  case 'select-all':{const ids=inBatch().filter(p=>p.status!=='uploaded').map(p=>p.id);selected=selected.size===ids.length?new Set():new Set(ids);render();break;}
  case 'bulk-edit':bulkEdit();break;
  case 'apply-bulk':{const data=Object.fromEntries(new FormData(document.querySelector('#bulk-form')));if(!Object.values(data).some(v=>v.trim())){toast('请至少填写一个需要更新的项目');break;}photos.filter(p=>selected.has(p.id)&&p.status!=='uploaded').forEach(p=>{Object.entries(data).forEach(([k,v])=>{if(v.trim())p[k]=v.trim()});p.status=isComplete(p)?'pending':'draft';});closeModal();render();toast(`已更新所选 ${selected.size} 张图片，可继续逐张修改`);break;}
  case 'upload-one':uploadPhotos([id]);break;
  case 'bulk-upload':uploadPhotos([...selected]);break;
  case 'withdraw':withdraw(id);break;
  case 'confirm-withdraw':{const p=photos.find(p=>p.id===id);if(p){p.status='pending';p.review='';currentBatch=p.batch;}closeOverlay();closeModal();page='records';tab='pending';render();toast('这张图片已撤回，其他图片保持原状态');break;}
  case 'delete':modal('删除这张图片？',number(photos.find(p=>p.id===id))+' 将从本次演示中删除，同批次的其他图片保留。',`<button class="secondary" data-action="close-modal">取消</button><button class="primary" data-action="confirm-delete" data-id="${id}">确认删除</button>`);break;
  case 'confirm-delete':photos=photos.filter(p=>p.id!==id);selected.delete(id);closeModal();closeOverlay();render();toast('已删除这张图片');break;
  case 'retake':rememberDetailForm(id);retakeId=id;modal('重拍此图片','可以从电脑选择新图片，也可以使用下一张示意图片演示替换。取消不会改变原图。',`<button class="secondary" data-action="retake-file">选择图片</button><button class="primary" data-action="retake-demo">使用示意图片</button>`);break;
  case 'retake-demo':{const p=photos.find(p=>p.id===retakeId);if(p&&p.status!=='uploaded'){p.art=(p.art+1)%6;p.src='';p.recognition=null;closeModal();detail(p.id);toast('已替换此图片，原有采集信息保留');}break;}
  case 'retake-file':document.querySelector('#retake-input').click();break;
  case 'open-camera':openCamera();break;
  case 'shutter':{const p=addPhoto('',seq%6);captureNew.push(p.id);document.querySelector('#film').innerHTML=captureNew.map(id=>{const p=photos.find(x=>x.id===id);return `<img src="${p.src||arts[p.art]}" alt="${number(p)}">`}).join('');document.querySelector('#capture-count').textContent=`已拍 ${captureNew.length} 张`;document.querySelector('#camera-scene').src=arts[seq%6];break;}
  case 'finish-camera':closeOverlay();page='records';tab='pending';render();if(captureNew.length)toast(`已保存 ${captureNew.length} 条独立图片记录，可以批量完善信息`);break;
  case 'import':document.querySelector('#import-input').click();break;
  case 'switch-batch':page='batches';selected.clear();selecting=false;render();break;
  case 'choose-batch':currentBatch=id;page='records';tab='pending';selected.clear();selecting=false;render();break;
  case 'new-batch':modal('新建采集批次','同一批次可以共用地点、日期和默认品种。',`<button class="secondary" data-action="close-modal">取消</button><button class="primary" data-action="create-batch">创建批次</button>`,`<form class="fields" id="batch-form"><label class="field" style="display:block"><div class="field-label">批次名称</div><input name="name" placeholder="例如：胡柚园 · 下午采集" maxlength="40" required></label><label class="field" style="display:block"><div class="field-label">采集地点</div><input name="place" placeholder="例如：青石镇 · C区" maxlength="60"></label><label><div class="field-label">默认品种</div><select name="variety">${options(['胡柚','香柚','温州蜜柑','不确定'],'胡柚')}</select></label></form>`);break;
  case 'create-batch':{const f=document.querySelector('#batch-form');if(!f.reportValidity())break;const d=Object.fromEntries(new FormData(f));if(!d.name.trim()){toast('请填写批次名称');break;}const newId=Math.max(...batches.map(b=>b.id))+1;batches.push({id:newId,name:d.name.trim(),place:d.place.trim()||'未填写地点',variety:d.variety,date:'10月25日'});currentBatch=newId;closeModal();page='capture';render();toast('新批次已创建，尚未生成任何图片记录');break;}
  case 'go-capture':page='capture';render();openCamera();break;
  case 'try-select':page='records';tab='pending';currentBatch=1;selecting=true;selected=new Set(inBatch().filter(p=>p.status!=='uploaded').slice(0,2).map(p=>p.id));closeOverlay();render();break;
  case 'show-uploaded':page='records';tab='uploaded';currentBatch=1;selected.clear();selecting=false;closeOverlay();render();break;
  case 'reset':init();toast('演示数据已重置');break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role="button"][data-action]'))e.target.click();if(e.key==='Escape'){if(document.querySelector('#modal').children.length)closeModal();else closeOverlay();}});
document.querySelector('#import-input').addEventListener('change',event=>{const files=[...event.target.files].filter(f=>f.type.startsWith('image/'));files.forEach(f=>addPhoto(URL.createObjectURL(f)));event.target.value='';if(files.length){page='records';tab='pending';render();toast(`已导入 ${files.length} 张，每张独立成条；未发送到服务器`);}});
document.querySelector('#retake-input').addEventListener('change',event=>{const f=event.target.files[0],p=photos.find(p=>p.id===retakeId);if(f&&f.type.startsWith('image/')&&p&&p.status!=='uploaded'){p.src=URL.createObjectURL(f);p.recognition=null;closeModal();detail(p.id);toast('已替换此图片，原有采集信息保留');}event.target.value='';});
init();
</script>
</body>
</html>
